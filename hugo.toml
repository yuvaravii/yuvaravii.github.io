baseURL = "https://yuvaravii.github.io/"
languageCode = "en-us"
title = "Ravishankar J"
theme = "PaperMod"
[pagination]
  pagerSize = 10

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  description = "AI/ML Engineer — building, writing, thinking."
  author = "Ravishankar J"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  defaultTheme = "auto"
  disableThemeToggle = false

  [params.homeInfoParams]
    Title = "Hey, I'm Ravishankar (RJ)"
    Content = """
AI/ML Engineer at Technosmile Japan. I build intelligent systems, break assumptions with data, and write about what I learn along the way.

Currently: building job-candidate matching algorithms with Random Forest surrogate optimization. Previously: Data Analyst at Merkle/Dentsu.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/yuvaravii"
  [[params.socialIcons]]
    name = "linkedin"
    url = "www.linkedin.com/in/ravishankarj"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:gceravishankar@gmail.com"

  [params.cover]
    hidden = true
    hiddenInList = true
    hiddenInSingle = true

  [params.editPost]
    URL = "https://github.com/yuvaravii/yuvaravii.github.io/tree/main/content"
    Text = "Suggest Changes"
    appendFilePath = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 10
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 20
  [[menu.main]]
    identifier = "frameworks"
    name = "Frameworks"
    url = "/frameworks/"
    weight = 30
  [[menu.main]]
    identifier = "experience"
    name = "Experience"
    url = "/experience/"
    weight = 35
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 40
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 50

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
